<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#4f6ef7" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon-192.png" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <title>日程安排</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      font-size: 14px; line-height: 1.6;
      background: #f3f4f6; color: #111827;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #0b0e14; color: #e6e8eb; }
      .it { border-color: #262b36 !important; background: rgba(255,255,255,.02) !important; }
      .muted { color: #9aa4b2 !important; }
      .dlg { background: #12161e !important; }
      input, textarea { background: rgba(255,255,255,.05); border-color: #262b36 !important; color: #e6e8eb; }
      .tabbar { background: #12161e; border-top-color: #262b36; }
    }
    .wrap { max-width: 560px; margin: 0 auto; padding: 14px 14px calc(76px + env(safe-area-inset-bottom)); }
    .head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; }
    .head h1 { margin: 0; font-size: 17px; }
    .head input[type="date"] {
      padding: 6px 10px; border-radius: 8px; border: 1px solid #d1d5db; font: inherit; outline: none;
    }
    .list { display: flex; flex-direction: column; gap: 8px; }
    .it {
      display: flex; gap: 10px; align-items: flex-start; padding: 11px 12px;
      border: 1px solid #e5e7eb; border-radius: 10px; background: #fff; cursor: pointer;
    }
    .it:active { opacity: .7; }
    .bar { width: 4px; align-self: stretch; border-radius: 2px; flex: none; }
    .time { flex: none; width: 84px; font-size: 12.5px; font-weight: 600; line-height: 1.45; }
    .time small { display: block; font-weight: 400; font-size: 10.5px; }
    .title { font-size: 14px; font-weight: 600; word-break: break-all; }
    .meta { font-size: 12px; margin-top: 2px; }
    .muted { color: #6b7280; }
    .empty { text-align: center; color: #6b7280; padding: 30px 0; }
    .loading { text-align: center; color: #6b7280; padding: 30px 0; }

    /* 对话框（弹层，两页共用） */
    .mask {
      position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 30;
      display: flex; align-items: flex-end; justify-content: center;
    }
    .dlg {
      width: 100%; max-width: 560px; background: #fff; border-radius: 14px 14px 0 0;
      padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
    }
    .dlg h2 { margin: 0 0 4px; font-size: 15px; }
    .dlg .rep { font-size: 12px; margin-bottom: 10px; }
    .field { margin-bottom: 10px; }
    .field label { display: block; font-size: 12px; margin-bottom: 3px; }
    .field input {
      width: 100%; padding: 9px 10px; border-radius: 8px; border: 1px solid #d1d5db; font: inherit; outline: none;
    }
    .field input:focus { border-color: #4f6ef7; }
    .row2 { display: flex; gap: 10px; }
    .row2 .field { flex: 1; }
    .btns { display: flex; gap: 10px; margin-top: 12px; }
    .btn {
      flex: 1; padding: 10px; border-radius: 8px; border: none; font: inherit; font-weight: 600; cursor: pointer;
    }
    .btnSave { background: #3fb950; color: #07130a; }
    .btnCancel { background: transparent; border: 1px solid #d1d5db; color: inherit; }
    .dlgMsg { min-height: 18px; font-size: 12px; margin-top: 8px; }
    .ok { color: #2da44e; } .err { color: #cf222e; }

    /* ===== 分页布局：页面一 = 日程（常规文档流），页面二 = 对话（占满标签栏以上空间） ===== */
    .pageSched { display: none; }
    .pageSched.on { display: block; }
    .pageChat {
      position: fixed; top: 0; left: 0; right: 0;
      bottom: calc(50px + env(safe-area-inset-bottom));
      max-width: 560px; margin: 0 auto;
      display: none; flex-direction: column;
    }
    .pageChat.on { display: flex; }

    /* 底部标签栏 */
    .tabbar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
      display: flex; height: calc(50px + env(safe-area-inset-bottom));
      background: #fff; border-top: 1px solid #e5e7eb;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .tabbar .tabBtn {
      flex: 1; border: none; background: none; font: inherit; font-size: 13px;
      color: #6b7280; cursor: pointer; position: relative; padding: 0;
    }
    .tabbar .tabBtn.on { color: #4f6ef7; font-weight: 600; }
    .tabbar .tabBtn .dot {
      display: none; position: absolute; top: 9px; left: 50%; margin-left: 22px;
      width: 8px; height: 8px; border-radius: 50%; background: #cf222e;
    }
    .tabbar .tabBtn .dot.on { display: block; }

    /* 对话电脑端 DSH（页面二） */
    .chat {
      display: flex; flex-direction: column; flex: 1; min-height: 0;
      padding: 12px 14px 10px;
    }
    .chat .chatTop { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
    .chat h3 { margin: 0; font-size: 14px; }
    .chatLog {
      display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px;
      flex: 1; min-height: 100px; overflow-y: auto; overscroll-behavior: contain;
      border: 1px solid rgba(128,128,128,.2); border-radius: 10px; padding: 8px;
      scrollbar-width: thin;
    }
    .bubble { max-width: 88%; padding: 8px 11px; border-radius: 12px; font-size: 13.5px; word-break: break-word; white-space: pre-wrap; }
    .bUser { align-self: flex-end; background: #4f6ef7; color: #fff; border-bottom-right-radius: 4px; }
    .bBot { align-self: flex-start; background: rgba(128,128,128,.14); border-bottom-left-radius: 4px; }
    /* Markdown 元素（消息气泡内；构建方式见 mdRender——仅 createElement/textContent，不进 HTML） */
    .bubble p { margin: 0 0 .5em; }
    .bubble > :last-child { margin-bottom: 0; }
    .bubble h1, .bubble h2, .bubble h3, .bubble h4, .bubble h5, .bubble h6 { margin: .3em 0 .35em; line-height: 1.35; }
    .bubble h1 { font-size: 1.28em; } .bubble h2 { font-size: 1.2em; } .bubble h3 { font-size: 1.12em; }
    .bubble h4, .bubble h5, .bubble h6 { font-size: 1.05em; }
    .bubble pre { margin: .45em 0; padding: 8px 10px; border-radius: 8px; background: rgba(128,128,128,.13); overflow-x: auto; }
    .bubble pre.mdCode::before { content: attr(data-lang); display: block; font-size: 10.5px; opacity: .65; margin-bottom: 4px; }
    .bubble pre.mdCode:not([data-lang])::before { content: none; }
    .bubble pre code { display: block; white-space: pre; background: none; padding: 0; font-size: 12px; }
    .bubble code { font-family: ui-monospace, SFMono-Regular, Consolas, "Courier New", monospace; font-size: .92em; background: rgba(128,128,128,.16); border-radius: 5px; padding: .08em .35em; }
    .bUser pre { background: rgba(0,0,0,.22); }
    .bUser code { background: rgba(0,0,0,.22); }
    .bubble table { border-collapse: collapse; margin: .45em 0; display: block; max-width: 100%; overflow-x: auto; }
    .bubble th, .bubble td { border: 1px solid rgba(128,128,128,.4); padding: 4px 8px; font-size: .95em; }
    .bubble blockquote { margin: .4em 0; padding: .1em .8em; border-left: 3px solid rgba(128,128,128,.45); }
    .bubble ul, .bubble ol { margin: .35em 0; padding-left: 1.35em; }
    .bubble li { margin: .15em 0; }
    .bubble li.mdTask { list-style: none; margin-left: -1.15em; }
    .bubble hr { border: none; border-top: 1px solid rgba(128,128,128,.4); margin: .6em 0; }
    .bBot a { color: #4f6ef7; text-decoration: underline; word-break: break-all; }
    .bUser a { color: #fff; text-decoration: underline; word-break: break-all; }
    @media (prefers-color-scheme: dark) { .bBot a { color: #8ea2ff; } }
    /* 问题 / 批准交互卡片 */
    .qcard { align-self: stretch; border: 1px solid #4f6ef7; border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
    .qcard.done { opacity: .55; border-color: rgba(128,128,128,.4); }
    .qcard .qtitle { font-size: 13.5px; font-weight: 600; }
    .qcard .qdetail { font-size: 12px; color: #6b7280; }
    .qopts { display: flex; flex-direction: column; gap: 6px; }
    .qopt { text-align: left; padding: 9px 11px; border-radius: 10px; border: 1px solid #d1d5db; background: transparent; color: inherit; font: inherit; font-size: 13px; cursor: pointer; }
    .qopt small { display: block; color: #6b7280; font-size: 11.5px; }
    .qopt.on { border-color: #4f6ef7; background: rgba(79,110,247,.12); }
    .qcustom { padding: 8px 10px; border-radius: 10px; border: 1px solid #d1d5db; font: inherit; font-size: 13px; outline: none; background: transparent; color: inherit; }
    .qsubmit { align-self: flex-end; padding: 8px 18px; border-radius: 10px; border: none; background: #3fb950; color: #07130a; font: inherit; font-weight: 600; cursor: pointer; }
    .qsubmit:disabled { opacity: .5; }
    .qbadge { font-size: 11.5px; color: #6b7280; }
    /* 思考过程 / 工具调用（同步展示；DeepSeek 风格：生成中展开跟随，结束收起计时保留） */
    .bReason {
      align-self: flex-start; max-width: 88%; font-size: 12px; color: #6b7280;
      background: rgba(128,128,128,.08); border-radius: 10px; padding: 4px 10px;
    }
    .bReason summary { cursor: pointer; font-size: 11.5px; }
    .bReason .rBody { white-space: pre-wrap; word-break: break-word; max-height: 30vh; overflow-y: auto; margin-top: 4px; }
    .bTool {
      align-self: flex-start; font-size: 11.5px; color: #6b7280;
      background: rgba(128,128,128,.08); border-radius: 8px; padding: 3px 8px;
    }
    /* 系统注入通知（单条：「已注入系统提示词」，替代显示设定原文） */
    .sysNote {
      align-self: center; max-width: 88%; font-size: 11px; color: #6b7280;
      background: rgba(128,128,128,.08); border-radius: 999px; padding: 2px 12px;
    }
    /* 工具卡片：完整过程（入参 + 输出） */
    .bToolCard {
      align-self: flex-start; max-width: 95%; font-size: 12px; color: #6b7280;
      background: rgba(128,128,128,.08); border-radius: 8px; padding: 4px 8px;
    }
    .bToolCard summary { cursor: pointer; font-size: 11.5px; word-break: break-all; }
    .bToolCard .tstat { font-weight: 600; }
    .bToolCard pre {
      white-space: pre-wrap; word-break: break-word; max-height: 26vh; overflow-y: auto;
      margin: 4px 0 0; background: rgba(128,128,128,.12); border-radius: 6px; padding: 6px; font-size: 11px;
    }
    .bToolCard .terr { color: #cf222e; }
    .crow { display: flex; gap: 8px; align-items: flex-end; }
    .crow textarea {
      flex: 1; min-width: 0; padding: 9px 10px; border-radius: 10px; border: 1px solid #d1d5db;
      font: inherit; line-height: 1.5; outline: none; resize: none;
      height: 42px; max-height: 35vh; overflow-y: auto;
    }
    .crow textarea:focus { border-color: #4f6ef7; }
    .crow button { flex: none; padding: 9px 16px; border-radius: 10px; border: none; background: #3fb950; color: #07130a; font: inherit; font-weight: 600; }
    .crow button:disabled { opacity: .5; }
    .attachBtn { background: transparent !important; border: 1px solid #d1d5db !important; color: inherit !important; padding: 9px 12px !important; }
    .thumbs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
    .thumb { position: relative; }
    .thumb img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; border: 1px solid rgba(128,128,128,.4); display: block; }
    .thumb button {
      position: absolute; top: -7px; right: -7px; width: 20px; height: 20px; border-radius: 50%;
      border: none; background: #cf222e; color: #fff; font-size: 12px; line-height: 1; cursor: pointer;
    }
    .chatHint { font-size: 11.5px; color: #6b7280; margin-top: 6px; }

    /* ===== 横屏周视图：横屏时以 7 列展示全周日程（显隐纯 CSS，内容由 renderWeek 填充） ===== */
    #weekGrid { display: none; }
    .wkCols { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; align-items: stretch; }
    .wkCol { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
    .wkDay {
      font-size: 11px; font-weight: 600; text-align: center; padding: 4px 0;
      border-radius: 6px; background: rgba(128,128,128,.12); white-space: nowrap;
    }
    .wkCol.today .wkDay { background: #4f6ef7; color: #fff; }
    .wkChip {
      border: 1px solid #e5e7eb; border-left-width: 3px; border-radius: 6px; background: #fff;
      padding: 3px 5px; cursor: pointer; min-width: 0;
    }
    .wkChip:active { opacity: .7; }
    .wkChip .t { font-size: 10px; font-weight: 600; color: #6b7280; line-height: 1.3; }
    .wkChip .n {
      font-size: 11px; font-weight: 600; line-height: 1.35; word-break: break-all;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .wkChip.wkTask { border-color: #f85149; background: rgba(248,81,73,.06); }
    .wkChip.wkTask .t, .wkChip.wkTask .n { color: #f85149; }
    .wkEmpty { font-size: 10px; color: #6b7280; text-align: center; padding: 8px 0; }
    @media (orientation: landscape) {
      .pageSched .wrap { max-width: none; padding-bottom: calc(60px + env(safe-area-inset-bottom)); }
      .pageSched .head input[type="date"], .pageSched #notifyRow, .pageSched #list { display: none; }
      .pageSched #weekGrid { display: block; }
      .pageSched .wkCols { align-items: start; max-height: calc(100vh - 120px); overflow-y: auto; }
    }
    @media (prefers-color-scheme: dark) {
      .wkDay { background: rgba(128,128,128,.18); }
      .wkChip { background: rgba(255,255,255,.03); border-color: #262b36; }
      .wkChip .n { color: #e6e8eb; }
      .wkChip.wkTask { background: rgba(248,81,73,.12); border-color: #f85149; }
    }
  </style>
</head>
<body>
  <!-- 页面一：日程 -->
  <div class="page pageSched on" id="pageSched">
    <div class="wrap">
      <div class="head">
        <h1>日程安排</h1>
        <input type="date" id="datePick" />
      </div>
      <!-- 系统级通知开关：Service Worker + Web Push（后台也能收到提醒）；横屏周视图下隐藏 -->
      <div id="notifyRow" style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
        <button id="notifyBtn" style="padding:6px 12px;border-radius:10px;border:1px solid #d1d5db;background:transparent;color:inherit;font:inherit;font-size:12px">🔔 开启系统通知</button>
        <span id="notifyState" style="font-size:11.5px;color:#6b7280">提醒为页面内弹窗</span>
      </div>
      <div class="loading" id="list">加载中…</div>
      <!-- 横屏周视图容器：竖屏隐藏，横屏（orientation: landscape）替换单日列表展示全周 -->
      <div id="weekGrid"></div>
    </div>
  </div>

  <!-- 页面二：对话电脑端 DSH（通过对话让 DSH 编辑日程表） -->
  <div class="page pageChat" id="pageChat">
    <div class="chat">
      <div class="chatTop">
        <h3>对话电脑端 DSH</h3>
        <div style="display:flex;gap:6px;align-items:center;flex:none;min-width:0">
          <button id="newChatBtn" style="padding:4px 10px;border-radius:999px;border:1px solid #d1d5db;background:transparent;color:inherit;font:inherit;font-size:11.5px;flex:none">✚ 新对话</button>
          <button id="modelBtn" style="padding:4px 10px;border-radius:999px;border:1px solid #d1d5db;background:transparent;color:inherit;font:inherit;font-size:11.5px;flex:none;max-width:38vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">模型：…</button>
        </div>
      </div>
      <div class="chatLog" id="chatLog"></div>
      <div class="thumbs" id="chatThumbs" style="display:none"></div>
      <div class="crow">
        <textarea id="chatIn" rows="1" placeholder="例如：把周五的英语课改到 14:00" enterkeyhint="send" autocomplete="off"></textarea>
        <button id="chatAttach" class="attachBtn" title="添加图片">📷</button>
        <button id="chatSend">发送</button>
      </div>
      <input type="file" id="chatFile" accept="image/png,image/jpeg,image/webp,image/gif,image/heic,image/heif,image/avif" multiple style="display:none" />
      <div class="chatHint">用自然语言指示电脑端 DSH 修改 schedule.json，可附图片（拍照/相册，自动压缩），回复后日程自动刷新。Enter 换行，Ctrl+Enter 或点「发送」发送。</div>
    </div>
  </div>

  <!-- 底部标签栏：日程 / 对话 分页切换 -->
  <nav class="tabbar" id="tabbar">
    <button class="tabBtn on" id="tabSched" type="button">📅 日程</button>
    <button class="tabBtn" id="tabChat" type="button">💬 对话<i class="dot" id="chatDot"></i></button>
  </nav>

  <!-- 共享领域判定核心（单一实现，与服务端 / 桌面端 / Python timetable_core.py 同语义） -->
  <script src="/occur.js"></script>
  <script src="/mobile-app.js"></script>
</body>
</html>
